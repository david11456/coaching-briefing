// ════════════════════════════════════════════════════════
//  INIT
// ════════════════════════════════════════════════════════
function init() {
  const months = Object.keys(briefings);
  const hash = location.hash.replace("#", "");
  activeMonth = (hash && briefings[hash]) ? hash : months[months.length - 1];
  renderTabs(months);
  renderPage(activeMonth);
  window.addEventListener("hashchange", () => {
    const h = location.hash.replace("#", "");
    if (h && briefings[h] && h !== activeMonth) {
      activeMonth = h;
      updateTabHighlight();
      renderPage(activeMonth);
    }
  });
}

// ════════════════════════════════════════════════════════
//  TABS
// ════════════════════════════════════════════════════════
function renderTabs(months) {
  document.getElementById("tabBar").innerHTML = months.map(m =>
    `<button class="tab-btn${m === activeMonth ? " active" : ""}" data-month="${m}" onclick="switchTab('${m}')">${briefings[m].label}</button>`
  ).join("");
}

function updateTabHighlight() {
  document.querySelectorAll(".tab-btn").forEach(b =>
    b.classList.toggle("active", b.dataset.month === activeMonth)
  );
}

function switchTab(month) {
  if (month === activeMonth) return;
  activeMonth = month;
  history.replaceState(null, "", "#" + month);
  updateTabHighlight();
  renderPage(month);
  window.scrollTo({ top: 0, behavior: "instant" });
}

// ════════════════════════════════════════════════════════
//  SUB NAV
// ════════════════════════════════════════════════════════
function renderSubNav() {
  document.getElementById("subNav").innerHTML = SECTIONS.map(s =>
    `<a class="snav-a" data-sec="${s.key}" href="#section-${s.key}"
       onclick="scrollToSec(event,'${s.key}')">${s.label}</a>`
  ).join("");
}

function scrollToSec(e, key) {
  e.preventDefault();
  const el = document.getElementById("section-" + key);
  if (!el) return;
  const top = el.getBoundingClientRect().top + window.scrollY - 190;
  window.scrollTo({ top, behavior: "smooth" });
}

function observeSections() {
  if (window._obs) window._obs.disconnect();
  window._obs = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        document.querySelectorAll(".snav-a").forEach(a =>
          a.classList.toggle("active", a.dataset.sec === e.target.dataset.sec)
        );
      }
    });
  }, { rootMargin: "-190px 0px -50% 0px", threshold: 0 });
  SECTIONS.forEach(s => {
    const el = document.getElementById("section-" + s.key);
    if (el) { el.dataset.sec = s.key; window._obs.observe(el); }
  });
}

// ════════════════════════════════════════════════════════
//  PAGE RENDER
// ════════════════════════════════════════════════════════
function renderPage(month) {
  renderSubNav();
  const data = briefings[month];
  const html = SECTIONS.map(sec =>
    sec.key === "competitors"
      ? renderCompetitors(data.sections.competitors)
      : renderSection(sec, data.sections[sec.key] || [])
  ).join("");
  document.getElementById("mainContent").innerHTML = html;
  observeSections();
}

// ════════════════════════════════════════════════════════
//  SECTION
// ════════════════════════════════════════════════════════
function renderSection(sec, items) {
  let body;
  if (!items.length) {
    body = `<p class="text-sm text-slate-400 italic pl-1">Keine relevanten Meldungen im Berichtszeitraum.</p>`;
  } else if (GROUPED_SECTIONS[sec.key]) {
    body = renderGrouped(items, GROUPED_SECTIONS[sec.key]);
  } else {
    body = `<div class="grid grid-cols-1 md:grid-cols-2 gap-4">${items.map(renderCard).join("")}</div>`;
  }
  return `<section id="section-${sec.key}" class="mb-14" style="scroll-margin-top:200px">
    <h2 class="text-base font-bold text-slate-900 mb-5 pb-2 border-b border-slate-200">${sec.label}</h2>
    ${body}
  </section>`;
}

// Rendern mit thematischen Sub-Headern (für userNeeds + science)
function renderGrouped(items, groupMeta) {
  const byGroup = {};
  const ungrouped = [];
  items.forEach(item => {
    if (item.group && groupMeta[item.group]) {
      (byGroup[item.group] = byGroup[item.group] || []).push(item);
    } else {
      ungrouped.push(item);
    }
  });
  let html = "";
  if (ungrouped.length) {
    html += `<div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">${ungrouped.map(renderCard).join("")}</div>`;
  }
  Object.keys(groupMeta).forEach(key => {
    const grpItems = byGroup[key];
    if (!grpItems || !grpItems.length) return;
    html += `<div class="mb-8">
      <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4 flex items-center gap-2">
        <span class="flex-none w-3 h-px bg-indigo-300"></span>
        ${groupMeta[key].label}
        <span class="flex-1 h-px bg-slate-100"></span>
      </h3>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">${grpItems.map(renderCard).join("")}</div>
    </div>`;
  });
  return html;
}

function renderCard(item) {
  const rel = RELEVANCE[item.relevance] || RELEVANCE[1];
  const tagCls = TAG_COLORS[item.tag] || "bg-slate-100 text-slate-600";
  const impl = item.implication
    ? `<div class="mt-3 pt-3 border-t border-slate-100">
         <p class="text-xs font-semibold text-indigo-600 uppercase tracking-wide mb-1">Was bedeutet das für uns?</p>
         <p class="text-sm text-slate-700 leading-relaxed">${item.implication}</p>
       </div>`
    : "";
  return `<div class="card bg-white rounded-xl border border-slate-200 p-5 shadow-sm flex flex-col gap-2 hover:shadow-md transition-shadow">
    <div class="flex items-start gap-2.5">
      <span class="mt-1.5 w-2.5 h-2.5 rounded-full flex-shrink-0 ${rel.cls}" title="${rel.title}"></span>
      <div class="flex-1 min-w-0">
        <a href="${item.url}" onclick="openLink(event,'${item.url}')"
           class="font-semibold text-sm text-indigo-700 hover:text-indigo-900 hover:underline leading-snug cursor-pointer">${item.title}</a>
        <div class="flex flex-wrap gap-x-2 gap-y-1 mt-1.5 items-center">
          <span class="text-xs text-slate-400">${item.source}</span>
          <span class="text-slate-300 text-xs">·</span>
          <span class="text-xs text-slate-400">${item.date}</span>
          <span class="text-xs px-2 py-0.5 rounded-full font-medium ${tagCls}">${item.tag}</span>
        </div>
      </div>
    </div>
    <p class="text-sm text-slate-600 leading-relaxed pl-5">${item.summary}</p>
    ${impl}
  </div>`;
}

    const mainGrid = COMP_FIELDS.map(f => {
      const items = c[f.key] || [];
      const body = items.length
        ? items.map(renderMiniCard).join("")
        : `<p class="text-xs text-slate-400 italic">Keine relevanten Meldungen</p>`;
      return `<div>
        <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">${f.label}</p>
        <div class="space-y-3">${body}</div>
      </div>`;
    }).join("");
    // Finanzen: volle Breite mit grünem Marker
    const finItems = c.financials || [];
    const finBody = finItems.length
      ? finItems.map(renderMiniCard).join("")
      : `<p class="text-xs text-slate-400 italic">Keine veröffentlichten Zahlen im Berichtszeitraum</p>`;
    const finRow = `<div class="mt-4 pt-3 border-t border-slate-100">
      <p class="text-xs font-bold text-emerald-600 uppercase tracking-wider mb-2 flex items-center gap-1.5">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        Finanzen
      </p>
      <div class="space-y-3">${finBody}</div>
    </div>`;
    return `<div class="card bg-white rounded-xl border border-slate-200 p-5 shadow-sm">
      <h3 class="text-sm font-bold text-slate-900 mb-4 pb-2 border-b border-slate-100">${name}</h3>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">${mainGrid}</div>
      ${finRow}
    </div>`;
  }).join("");
  return `<section id="section-competitors" class="mb-14" style="scroll-margin-top:200px">
    <h2 class="text-base font-bold text-slate-900 mb-5 pb-2 border-b border-slate-200">Wettbewerb</h2>
    <div class="grid grid-cols-1 xl:grid-cols-2 gap-5">${cards}</div>
  </section>`;
}

function renderMiniCard(item) {
  const rel = RELEVANCE[item.relevance] || RELEVANCE[1];
  const tagCls = TAG_COLORS[item.tag] || "bg-slate-100 text-slate-600";
  const impl = item.implication
    ? `<p class="text-xs text-indigo-600 mt-1 leading-relaxed">${item.implication}</p>`
    : "";
  return `<div class="flex gap-2">
    <span class="mt-1 w-2 h-2 rounded-full flex-shrink-0 ${rel.cls}" title="${rel.title}"></span>
    <div class="min-w-0">
      <a href="${item.url}" onclick="openLink(event,'${item.url}')"
         class="text-xs font-semibold text-indigo-700 hover:text-indigo-900 hover:underline leading-snug cursor-pointer">${item.title}</a>
      <div class="flex flex-wrap gap-x-1.5 items-center mt-0.5">
        <span class="text-xs text-slate-400">${item.source} · ${item.date}</span>
        <span class="text-xs px-1.5 py-px rounded-full font-medium ${tagCls}">${item.tag}</span>
      </div>
      <p class="text-xs text-slate-600 mt-1 leading-relaxed">${item.summary}</p>
      ${impl}
    </div>
  </div>`;
}

// ════════════════════════════════════════════════════════
//  LINK HANDLER  (works in sandboxed iframes + standalone)
// ════════════════════════════════════════════════════════
function openLink(e, url) {
  e.preventDefault();
  e.stopPropagation();
  const opened = window.open(url, "_blank", "noopener,noreferrer");
  if (!opened) window.location.href = url; // fallback: same tab
}

// ════════════════════════════════════════════════════════
//  COPY LINK
// ════════════════════════════════════════════════════════
function copyLink() {
  const url = location.href.split("#")[0] + "#" + activeMonth;
  const btn = document.getElementById("copyBtn");
  const orig = btn.innerHTML;
  const ok = `<svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg> Kopiert!`;
  (navigator.clipboard
    ? navigator.clipboard.writeText(url)
    : Promise.reject()
  ).then(() => {
    btn.innerHTML = ok;
    setTimeout(() => { btn.innerHTML = orig; }, 2000);
  }).catch(() => {
    prompt("Link markieren und kopieren:", url);
  });
}

// Start
init();
</script>
